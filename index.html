.js-v{flex:1 1 300px;min-width:0}
.js-row.fav .js-v p{font-family:var(--font-accent);font-style:italic;font-size:24px;color:var(--bg)}
.js-more{display:flex;justify-content:center;padding:16px;background:var(--wash)}
.js-empty{padding:24px 24px 24px 242px}
.j-plink{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;border:1px solid #F3C4CB;background:#fff;text-decoration:none;color:var(--ink)}
.j-plink > span:first-child{flex:1}
.j-plink b{display:block;font-size:15.5px}
.j-plink span span{font-size:13px;color:var(--muted)}
.j-plink > span:last-child{font-size:22px;font-weight:700;color:var(--bg)}
/* review backlog */
.bl-imp{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px}
.bl-imp h2{margin:0 0 4px;font-size:21px}
.bl-imp-r{border-left:1px solid var(--line);padding-left:24px}
.bl-h{margin:0 0 8px;font-weight:700;font-size:14px}
.bl-paste{display:block;width:100%;box-sizing:border-box;border-radius:14px;border:1px dashed #D9A9B2;background:#fff;padding:12px 14px;font:inherit;font-size:16px;line-height:1.5;resize:vertical;margin-top:10px}
.bl-impacts{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
.bl-impacts .btn{height:42px;padding:0 18px}
.bl-msg{margin:10px 0 0}
.bl-listh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 12px;color:var(--on-bg)}
.bl-listh h2{margin:0;font-size:22px}
.bl-listh > span{font-size:14px;opacity:.85}
.bl-all{margin-left:auto}
.bl-list{display:grid;gap:14px;margin-bottom:28px}
.bl-item{display:block;padding:0;border-radius:18px;overflow:hidden;background-color:var(--card);border-bottom:0;border-left:6px solid var(--line);background-image:none}
.bl-item.open{border-left-color:var(--stripe)}
.bl-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:28px;padding:16px 22px 14px;background-image:repeating-linear-gradient(180deg,transparent 0,transparent 31px,#F6DCE0 31px,#F6DCE0 32px);background-position:0 14px}
.bl-form{border-top:2px solid var(--stripe);padding:18px 22px 22px;background:#fff;display:grid;gap:16px}
.bl-g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.bl-form .af > span{margin-bottom:6px}
.bl-form .ctl{height:44px;font-size:16px;text-transform:none;letter-spacing:0;font-weight:400}
.bl-text .dz-lta{min-height:96px;text-transform:none;letter-spacing:0;font-weight:400;font-size:16px}
.bl-sg{font-style:normal;text-transform:none;letter-spacing:0;font-weight:600;color:#87480A}
.dz-chip.sug .sg{color:#87480A;font-size:12px}
.dz-chip.sug[aria-pressed="false"]{border-style:dashed;border-color:#E3963A}
.bl-acts{display:flex;gap:10px;flex-wrap:wrap}
.bl-acts .btn{height:44px;padding:0 18px}
.bl-del{margin-left:auto}
/* floating arrow back to the top */
.to-top{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));z-index:35;width:54px;height:54px;border-radius:50%;border:3px solid #FFFDF8;background:var(--bg);color:#FFFDF8;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 24px rgba(40,8,24,.4),0 0 16px rgba(246,147,150,.6)}
.to-top svg{width:22px;height:22px}
.to-top[hidden]{display:none}
@media (max-width:1000px){
  .jc-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .js-top2,.bl-imp{grid-template-columns:1fr}

}

  .js-e{grid-template-columns:70px minmax(0,1fr);gap:14px;padding:16px 14px 14px}
  .js-d{font-size:24px;padding:0 3px}
  .js-dw{font-size:10px}
  .js-stks{flex-direction:column;align-items:flex-end;gap:10px}

  .js-empty{padding:20px 14px 20px 98px}

  .bl-row .js-stks{display:none}

  .bl-del{margin-left:0}

  .pv-month .pv-cell.cutoff:not(.top5)::after{content:'';width:8px;height:8px;padding:0;top:5px;right:5px}

}

.jh{position:absolute;height:auto;overflow:visible;filter:drop-shadow(0 0 6px rgba(255,170,190,.9)) drop-shadow(0 0 18px rgba(246,147,150,.6))}

.jh-1{right:8%;top:22px;width:86px;animation:jhb 4.2s ease-in-out infinite}
.jh-2{right:25%;top:12px;width:34px;transform:rotate(-14deg)}

.jh-4{right:22%;top:80px;width:42px;transform:rotate(9deg)}
.jh-5{right:36%;top:54px;width:20px;transform:rotate(-10deg)}
.jh-6{right:15%;top:140px;width:16px;transform:rotate(-6deg)}
.jh-7{right:2%;top:12px;width:22px;transform:rotate(16deg)}

.jh-s1{right:31%;top:28px}.jh-s2{right:5%;top:92px;animation-delay:1.1s}.jh-s3{right:29%;top:126px;animation-delay:2.1s}.jh-s4{right:17%;top:8px;animation-delay:.6s}.jh-s5{right:40%;top:98px;width:3px;height:3px;animation-delay:1.7s}

}

  var a = it.date, out = [], stop = validISO(it.end) && it.end < end ? it.end : end, once = it.recurring === 'no' || it.freq === 'once';
  var first = !once && validISO(it.start) ? it.start : a;
  if(start < first) start = first;
  if(stop < start) return out;
  if(once){ if(a >= start && a <= stop) out.push(a); return out; }
  var f = it.freq || 'monthly';
  if(f === 'weekly' || f === 'biweekly'){
    var step = f === 'weekly' ? 7 : 14, k = Math.ceil(daysBetween(a, start) / step), d = addDays(a, k * step), g = 0;
    while(d <= stop && g++ < 800){ out.push(d); d = addDays(d, step); }

  var A = parse(a), s0 = parse(start), e = parse(stop), y = s0.y, m = s0.m, g2 = 0;
  while((y < e.y || (y === e.y && m <= e.m)) && g2++ < 400){
    var diff = (y - A.y) * 12 + (m - A.m);
    if(diff % ms === 0){ var dd = iso(y, m, Math.min(A.d, dim(y, m))); if(dd >= start && dd <= stop) out.push(dd); }
    m++; if(m > 12){ m = 1; y++; }
  }
  return out;
}

function finRange(r0, r1){

  S.items.forEach(function(it){
    if(it.kind === 'bill') occList(it, r[0], r[1]).forEach(function(d){
      var a = num(it.amount); o.billDue += a; o.nBills++;
      if(it.paid && it.paid[d]){ o.billPaid += a; o.nPaid++; } else if(d >= t) o.billUpcoming += a; else o.billLate += a;
    });
    else if(it.kind === 'income') occList(it, r[0], r[1]).forEach(function(d){
      var pa = num(it.amount), got = it.received && it.received[d] != null && it.received[d] !== '', rv = got ? num(it.received[d]) : 0, k = it.source || 'General';
      var b = o.bySource[k] || (o.bySource[k] = {proj:0, recv:0});

    });
    else if(it.kind === 'expense'){ if(validISO(it.date) && it.date >= r[0] && it.date <= r[1]){ var a2 = num(it.amount), c = it.ecat || 'Other'; o.spent += a2; o.nSpent++; o.byCat[c] = (o.byCat[c] || 0) + a2; } }

function debtRate(it){ var apr = num(it.apr) / 100, f = it.freq || 'monthly'; return f === 'weekly' ? apr * 7 / 365 : f === 'biweekly' ? apr * 14 / 365 : f === 'yearly' ? apr : apr / 12; }

function payoffSingle(bal, apr, pay){
  var i = apr / 100 / 12, n = 0, interest = 0;
  if(bal <= 0) return {n:0, interest:0};
  if(pay <= bal * i + 0.005) return {never:true};
  while(bal > 0.005 && n < 600){ var x = bal * i; interest += x; bal = bal + x - Math.min(pay, bal + x); n++; }
  return n >= 600 ? {never:true} : {n:n, interest:interest};

function payoffPlan(debts, budget, method, rollover){
  var ds = debts.filter(function(d){ return num(d.balance) > 0; }).map(function(d){ return {id:d.id, name:d.name || 'Debt', bal:num(d.balance), i:num(d.apr) / 100 / 12, min:monthlyMin(d)}; });
  var start = ds.reduce(function(a, d){ return a + d.bal; }, 0), minSum = ds.reduce(function(a, d){ return a + d.min; }, 0);
  budget = rollover ? Math.max(budget || 0, minSum) : minSum;
  var order = ds.slice().sort(method === 'avalanche' ? function(a,b){ return b.i - a.i || a.bal - b.bal; } : function(a,b){ return a.bal - b.bal || b.i - a.i; })
    .map(function(d){ return {id:d.id, name:d.name, bal:d.bal, apr:d.i * 1200}; });
  var series = [start], interest = 0, month = 0, doneAt = {}, stuck = false;

    month++;

    ds.forEach(function(d){ if(d.bal > 0.005){ var p = Math.min(d.min, d.bal); d.bal -= p; left -= p; } });
    if(rollover){ for(var k = 0; k < order.length && left > 0.005; k++){ var tg = ds.filter(function(x){ return x.id === order[k].id; })[0]; if(tg.bal > 0.005){ var p2 = Math.min(left, tg.bal); tg.bal -= p2; left -= p2; } } }
    ds.forEach(function(d){ if(d.bal <= 0.005 && !doneAt[d.id]){ d.bal = 0; doneAt[d.id] = month; } });
    var tot = ds.reduce(function(a, d){ return a + d.bal; }, 0);

}
function applyDebtPayment(d, occ, on){
  d.paid = d.paid || {};

    if(d.paid[occ]) return;
    var bal = num(d.balance), rate = debtRate(d), interest = bal * rate, amt = Math.min(num(d.minPay), bal + interest), principal = Math.max(0, Math.min(bal, amt - interest));
    d.balance = (bal - principal).toFixed(2);
    d.paid[occ] = {amt:amt.toFixed(2), principal:principal.toFixed(2), on:today()};

function billDueIn(b, y, m){
  if(!validISO(b.date)) return null;
  var a = parse(b.date), diff = (y - a.y) * 12 + (m - a.m);
  if(diff < 0) return null;
  var step = FREQ_STEP[b.freq] != null ? FREQ_STEP[b.freq] : 1;
  if(step === 0 ? diff !== 0 : diff % step !== 0) return null;
  if(validISO(b.end)){ var e = parse(b.end); if((y - e.y) * 12 + (m - e.m) > 0) return null; }
  return iso(y, m, Math.min(a.d, dim(y, m)));

function collect(start, end, useFilter, noDating){
  var map = {};
  function put(d, it, extra){
    if(d < start || d > end) return;
    if(useFilter && S.ui.hide[catOf(it)]) return;
    var e = Object.assign({it:it, d:d}, extra || {});
    (map[d] || (map[d] = [])).push(e);
  }
  S.items.forEach(function(it){
    if(it.kind === 'dentry' && (noDating || it.reflect)) return;
    if(it.kind === 'person'){ personEntries(it, start, end, put); return; }
    if(it.kind === 'checkin' && !cmPerson(it.pid)) return;
    if(it.kind === 'trip' || it.kind === 'event'){
      if(!validISO(it.date)) return;
      var last = validISO(it.end) && it.end > it.date ? it.end : it.date;
      if(last < start || it.date > end) return;
      var d = it.date < start ? start : it.date, stop = last > end ? end : last, n = 0;
      while(d <= stop && n < 400){ put(d, it, {span: last !== it.date, first: d === it.date, last: last}); d = addDays(d, 1); n++; }
    } else if(it.kind === 'bill' || it.kind === 'income' || it.kind === 'debt'){
      occList(it, start, end).forEach(function(d){
        var ex = {occ:d};
        if(it.kind === 'income') ex.recv = !!(it.received && it.received[d] != null && it.received[d] !== '');
        else ex.paid = !!(it.paid && it.paid[d]);
        if(it.kind === 'debt' && !ex.paid && num(it.balance) <= 0) return;
        put(d, it, ex);
      });
    } else if(validISO(it.date)){
      put(it.date, it);
    }
  });
  ((S.content && S.content.posts) || []).forEach(function(cp){ if(validISO(cp.date)) put(cp.date, cp); });
  Object.keys(map).forEach(function(k){
    map[k].sort(function(a,b){
      return itTime(a.it).localeCompare(itTime(b.it)) || CAT_ORDER.indexOf(catOf(a.it)) - CAT_ORDER.indexOf(catOf(b.it)) || (a.it.name||'').localeCompare(b.it.name||'');
    });
  });
  return map;
}

var BL_MON = 'jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|june?|july?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?';
var BL_WD = '(?:(?:mon|tues?|wed(?:nes)?|thu(?:rs?)?|fri|sat(?:ur)?|sun)(?:day)?\\.?,?\\s+)?';
var BL_DATE = BL_WD + '(?:(\\d{1,2})[\\/.\\-](\\d{1,2})(?:[\\/.\\-](\\d{2,4}))?|(' + BL_MON + ')\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?(?:,?\\s+(\\d{4}))?)';
var BL_AT = new RegExp('^' + BL_DATE + '(?![\\d\\/])\\s*(?:[:\\-\u2013\u2014|]\\s*|\\s+|$)', 'i');
var BL_END = new RegExp('^(.{1,70}?)\\s*[:\\-\u2013\u2014|]\\s*' + BL_DATE + '\\s*[.!]?\\s*$', 'i');
function blMonth(s){ return ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(String(s).slice(0, 3).toLowerCase()) + 1; }
function blYmd(m, off, lastY){

  if(m[off]){ mo = +m[off]; d = +m[off + 1]; y = m[off + 2] ? +m[off + 2] : 0; }
  else { mo = blMonth(m[off + 3]); d = +m[off + 4]; y = m[off + 5] ? +m[off + 5] : 0; }
  if(y && y < 100) y += 2000;
  var t = today(), guess = !y;

  if(mo < 1 || mo > 12 || d < 1 || d > dim(y, mo)) return null;
  var out = iso(y, mo, d);
  if(guess && !lastY && out > addDays(t, 31)) out = iso(y - 1, mo, Math.min(d, dim(y - 1, mo)));
  return out;
}

document.addEventListener('input', function(e){
  var el = e.target;
  if(el.hasAttribute && el.hasAttribute('data-jc-date')){ JC_DATE = el.value; return; }
  if(el.hasAttribute && el.hasAttribute('data-jw')){ var p = dzPerson(el.getAttribute('data-pid')); if(p){ p[el.getAttribute('data-jw')] = el.value; save(); growAny(el); } return; }
  if(el.hasAttribute && el.hasAttribute('data-bl')){
    var b = blGet(el.getAttribute('data-id')), f = el.getAttribute('data-bl'); if(!b) return;
    if(f === 'title' || f === 'text'){ b[f] = el.value; blTouch(b); if(f === 'text') growAny(el); var h3 = el.closest('.bl-item') && el.closest('.bl-item').querySelector('.js-top h3'); if(h3 && f === 'title') h3.textContent = el.value || 'Untitled'; }
  }
});
document.addEventListener('change', function(e){
  var el = e.target; if(!el.hasAttribute || !el.hasAttribute('data-bl')) return;
  var b = blGet(el.getAttribute('data-id')), f = el.getAttribute('data-bl'); if(!b) return;
  if(f === 'date' && validISO(el.value)){ b.date = el.value; b.nodate = false; if(b.stayed && (!validISO(b.left) || b.left < b.date)) b.left = addDays(b.date, 1); blTouch(b); render(); }
  else if(f === 'left' && validISO(el.value)){ b.left = el.value; blTouch(b); }
  else if(f === 'stayed'){ b.stayed = el.checked; if(b.stayed && !validISO(b.left)) b.left = addDays(b.date, 1); blTouch(b); render(); }
});
/* the floating arrow back to the top */
(function(){
  var btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'to-top'; btn.id = 'to-top'; btn.setAttribute('data-act', 'to-top'); btn.setAttribute('aria-label', 'Back to top'); btn.title = 'Back to top'; btn.hidden = true;
  btn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  document.body.appendChild(btn);
  function upd(){ var on = (window.pageYOffset || 0) > 500 && !D.mode; if(btn.hidden === on) btn.hidden = !on; }
  window.addEventListener('scroll', upd, {passive:true}); setInterval(upd, 800);
})();

function afterRender(){ Array.prototype.forEach.call(main.querySelectorAll('.js-wta, .bl-item .dz-lta'), growAny); }
window.__journal = {blParse:blParse, top5:jTop5, get backlog(){ return S.dzBacklog; }};

setSync(storageOK ? 'ok' : 'off');
route();
refreshWeather();
})();
